name: E2E Playwright (smoke)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'agrogestion-frontend/**'
      - '.github/workflows/e2e-playwright.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'agrogestion-frontend/**'
      - '.github/workflows/e2e-playwright.yml'
  workflow_dispatch:

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agrogestion-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: agrogestion-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke login (sin backend)
        run: npm run e2e:smoke
        env:
          CI: true

      - name: Subir reporte Playwright
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: agrogestion-frontend/playwright-report/
          retention-days: 7
