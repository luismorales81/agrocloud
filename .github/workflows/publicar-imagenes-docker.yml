name: Publicar imagenes Docker

on:
  push:
    branches: [main]
    paths:
      - 'agrogestion-backend/**'
      - 'agrogestion-frontend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/publicar-imagenes-docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  VITE_API_BASE_URL: /api

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nombres de imagen GHCR
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/agrogestion-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/agrogestion-frontend" >> "$GITHUB_OUTPUT"

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push backend
        uses: docker/build-push-action@v6
        with:
          context: ./agrogestion-backend
          file: ./agrogestion-backend/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:${{ github.sha }}
            ${{ steps.names.outputs.backend }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build y push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./agrogestion-frontend
          file: ./agrogestion-frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.frontend }}:${{ github.sha }}
            ${{ steps.names.outputs.frontend }}:latest
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.names.outputs.backend }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.names.outputs.frontend }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
