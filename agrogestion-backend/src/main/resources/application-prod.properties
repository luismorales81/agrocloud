# ========================================
# AgroCloud - Configuración PRODUCCIÓN (cloud)
# ========================================
# Perfil válido para Render, Railway, Fly.io. Todas las credenciales por variables de entorno.

spring.profiles.active=prod

# Servidor - Puerto compatible con cloud (PORT lo inyectan Render/Railway/Fly.io)
server.port=${PORT:8080}
server.address=0.0.0.0

# Base de datos - Solo variables de entorno (sin valores por defecto)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate - Producción
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.flyway.enabled=false

# Logging - Nivel INFO
logging.level.root=INFO
logging.level.com.agrocloud=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO

# JWT - Requiere JWT_SECRET en entorno
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS y URLs frontend
cors.allowed.origins=${FRONTEND_URL}
email.frontend.url=${FRONTEND_URL}
email.reset.password.url=${FRONTEND_URL}/reset-password
email.verify.email.url=${FRONTEND_URL}/verify-email

# Email SMTP - Solo variables de entorno
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=${MAIL_FROM}

# Archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Seguridad - No exponer errores al cliente
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
