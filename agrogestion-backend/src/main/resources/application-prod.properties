# ========================================
# AgroCloud - Configuración PRODUCCIÓN (cloud)
# ========================================
# Perfil válido para Render, Railway, Fly.io. Todas las credenciales por variables de entorno.

# Perfil: SPRING_PROFILES_ACTIVE=prod (no definir spring.profiles.active aquí: Spring Boot 3 lo rechaza).

# Servidor - Puerto compatible con cloud (PORT lo inyectan Render/Railway/Fly.io)
server.port=${PORT:8080}
server.address=0.0.0.0

# Base de datos - Solo variables de entorno (sin valores por defecto)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate - Producción
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Por defecto desactivado (despliegues cloud actuales migran a mano).
# Docker Compose local y un VPS desde cero deben definir SPRING_FLYWAY_ENABLED=true.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.validate-migration-naming=true
spring.flyway.out-of-order=true

# Logging - Nivel INFO
logging.level.root=INFO
logging.level.com.agrocloud=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO

# JWT - Requiere JWT_SECRET en entorno (mínimo 32 caracteres, HS256)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS y URLs frontend
cors.allowed.origins=${FRONTEND_URL}
email.frontend.url=${FRONTEND_URL}
email.reset.password.url=${FRONTEND_URL}/reset-password
email.verify.email.url=${FRONTEND_URL}/verify-email

# Email SMTP — opcional (vacío = la app arranca sin correo)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=${MAIL_FROM:}

# Chat IA — cifrado de claves Gemini por usuario
chat.ia.encryption-key=${CHAT_IA_ENCRYPTION_KEY}

# En HTTPS de producción: true + None. En Docker local HTTP: JWT_COOKIE_SECURE=false y SameSite=Lax.
jwt.cookie.secure=${JWT_COOKIE_SECURE:true}
jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE:None}

app.eula.storage.path=${EULA_STORAGE_PATH:./eula-pdfs}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# OpenWeatherMap
weather.openweather.api-key=${OPENWEATHER_API_KEY:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

# Logging a stdout (Docker / VPS). No escribir secretos en archivo dentro de la imagen.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Solo compose local (docker-compose.yml). En VPS dejar false o ausente.
app.crear-usuario-local=${APP_CREAR_USUARIO_LOCAL:false}
app.usuario-local-email=${APP_USUARIO_LOCAL_EMAIL:admin@localhost}
app.usuario-local-password=${APP_USUARIO_LOCAL_PASSWORD:}

# Seguridad - No exponer errores al cliente
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
