# ========================================
# CONFIGURACIÓN BASE - Variables de entorno
# ========================================
# En producción NUNCA usar perfil default sin variables. Usar perfil prod.

spring.profiles.active=default

# Configuración del servidor
server.port=${PORT:8080}
server.servlet.context-path=/

# Base de datos - Variables de entorno. Valores por defecto = MySQL local (root/123456, base agrocloud).
# En producción (perfil prod) no hay defaults; definir DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD.
# Para otro MySQL (ej. docker-compose) define DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD en .env
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/agrocloud?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:123456}

# Configuración del pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.open-in-view=false

spring.sql.init.mode=never
spring.flyway.enabled=true
# Falla al arrancar si hay archivos en db/migration con nombre inválido (listarlos en el log)
spring.flyway.validate-migration-naming=true
# Permite aplicar migraciones con version menor si la BD ya tiene otras mayores (huecos en historial local).
# En prod los perfiles que desactivan Flyway ignoran esta propiedad.
spring.flyway.out-of-order=true

# JWT - En local sin .env usa valor por defecto solo para desarrollo. En prod definir JWT_SECRET siempre.
jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyDoNotUseInProduction}
jwt.expiration=86400000
jwt.refresh-token.expiration=604800000

# Logging
logging.level.com.agrocloud=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=INFO

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.validation.enabled=true

# CORS (en producción usar CORS_ALLOWED_ORIGINS en SecurityConfig)
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Archivos y caché
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.cache.type=simple
spring.session.store-type=none
spring.main.allow-circular-references=true

# Email - Variables de entorno. Valores vacíos por defecto = correo no configurado (app arranca igual).
# Spring Boot solo activa MailSender cuando spring.mail.host está definido.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.ssl.trust=smtp.zoho.com
spring.mail.properties.mail.debug=false
spring.mail.from=${MAIL_FROM:}

email.frontend.url=${FRONTEND_URL:http://localhost:3000}

# OpenWeatherMap (clima en WeatherService). Sin valor, los endpoints que llaman a OpenWeather fallan con mensaje claro.
weather.openweather.api-key=${OPENWEATHER_API_KEY:}
